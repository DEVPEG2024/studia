<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Padel">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Padel - simulateur Redmi Watch 4</title>
<style>
  /* Un terrain de padel vu du dessus, sous les projecteurs.
     Parti pris assumé d'un seul monde visuel : tout est peint explicitement,
     la page tient donc sur n'importe quel fond hôte. */
  :root {
    color-scheme: dark;
    --court:  #0a1018;   /* résine bleutée sous éclairage */
    --deep:   #060a11;
    --line:   #22303f;   /* lignes peintes, montants du filet */
    --ball:   #e4f24a;   /* jaune optique — NOUS */
    --glass:  #57b0ff;   /* bleu du terrain — EUX */
    --chalk:  #e8eef5;
    --shade:  #6b7f93;
    --alert:  #ffb340;
    --sys: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    overscroll-behavior: none;
    touch-action: manipulation;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px 12px;
    background: #11161d;
    color: var(--chalk);
    font-family: var(--sys);
    font-size: 14px;
  }

  /* --- le terrain : 390 x 450, la dalle de la Redmi Watch 4 --- */
  .watch {
    width: 390px;
    height: 450px;
    border-radius: 44px;
    background: var(--court);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 0 0 9px #1b222c, 0 20px 54px rgba(0, 0, 0, .65);
    user-select: none;
    -webkit-user-select: none;
  }

  /* --- ligne de match : où on en est, et ce qui est déjà joué --- */
  .matchline {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    height: 44px;
    padding: 0 16px;
    border-bottom: 1px solid var(--line);
  }
  .phase {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .16em;
    color: var(--shade);
    white-space: nowrap;
  }
  .history {
    font-family: var(--mono);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--shade);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* --- les deux camps --- */
  .court { flex: 1; display: flex; flex-direction: row; min-height: 0; }

  .half {
    position: relative;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 0 2vmin;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    /* La surface du camp : plus claire au fond, comme sous les projecteurs.
       Sans elle, le vide autour du score ne ressemble à rien. */
    background: linear-gradient(180deg, #0d151f 0%, var(--court) 62%);
  }
  /* Le camp au service s'éclaire : la pastille de 10 px devient un demi-écran.
     Le halo s'éteint aux deux extrémités, sinon il se coupe net en bas. */
  .half::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    transition: opacity .22s ease;
  }
  .half-a::after { background: linear-gradient(180deg, rgba(228, 242, 74, 0) 26%, rgba(228, 242, 74, .10) 78%, rgba(228, 242, 74, 0) 100%); }
  .half-b::after { background: linear-gradient(180deg, rgba(87, 176, 255, 0) 26%, rgba(87, 176, 255, .11) 78%, rgba(87, 176, 255, 0) 100%); }
  .half.serving::after { opacity: 1; }

  .half-a.tapped { background: rgba(228, 242, 74, .13); }
  .half-b.tapped { background: rgba(87, 176, 255, .13); }

  /* Un jeu qui bascule mérite plus qu'un chiffre qui change : le camp
     gagnant s'illumine brièvement. Le halo de service occupe déjà ::after. */
  .half::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
  }
  /* Un halo serré autour du score, pas un lavis sur tout le camp : à pleine
     intensité, un aplat large noie les chiffres au lieu de les fêter. */
  .half-a::before { background: radial-gradient(circle at 50% 47%, rgba(228, 242, 74, .20), transparent 52%); }
  .half-b::before { background: radial-gradient(circle at 50% 47%, rgba(87, 176, 255, .22), transparent 52%); }
  .half.won-game::before { animation: flash .55s ease-out; }
  .half.won-set::before { animation: flash .95s ease-out; }

  @keyframes flash {
    0%   { opacity: 0; }
    10%  { opacity: 1; }
    100% { opacity: 0; }
  }

  /* Le point marqué atterrit : on sent le tap sans avoir à regarder. */
  @keyframes land {
    0%   { transform: scale(.8); opacity: .55; }
    62%  { transform: scale(1.07); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }
  .point.land { animation: land .24s cubic-bezier(.2, 1.4, .4, 1); }

  /* Le compteur de jeux prend le relais quand le point retombe à zéro. */
  @keyframes pop {
    0%   { transform: scale(1); }
    45%  { transform: scale(1.4); }
    100% { transform: scale(1); }
  }
  .games-n.pop { display: inline-block; animation: pop .5s cubic-bezier(.2, 1.5, .4, 1); }

  /* Le filet : deux montants et une maille, pas un simple trait. */
  .net {
    width: 3px;
    align-self: center;
    height: 82%;
    background:
      linear-gradient(180deg, var(--line) 0 6px, transparent 6px calc(100% - 6px), var(--line) calc(100% - 6px) 100%),
      repeating-linear-gradient(180deg, var(--line) 0 3px, transparent 3px 8px);
  }

  /* Plaque d'équipe : le nom, et les sets qui lui appartiennent. */
  .plate { display: flex; align-items: center; gap: 7px; }
  .team {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .15em;
    color: var(--shade);
  }
  .sets {
    min-width: 20px;
    padding: 1px 5px;
    border: 1px solid var(--line);
    border-radius: 5px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    text-align: center;
    color: var(--shade);
  }
  .half-a .sets.won { border-color: rgba(228, 242, 74, .55); color: var(--ball); }
  .half-b .sets.won { border-color: rgba(87, 176, 255, .55); color: var(--glass); }

  /* Les deux emplacements de service, et la balle sur celui d'où l'on engage.
     Un rail continu ferait curseur de réglage ; deux marques font un terrain.
     La piste occupe sa place des deux côtés même vide, sinon les deux gros
     scores se désaligneraient. */
  .serve {
    position: relative;
    width: 58px;
    height: 16px;
    opacity: 0;
  }
  .serve.on { opacity: 1; }
  .serve::before,
  .serve::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border: 1px solid var(--line);
    border-radius: 50%;
  }
  .serve::before { left: 0; }
  .serve::after { right: 0; }
  .ball {
    position: absolute;
    top: 50%;
    left: 0;
    width: 14px;
    height: 14px;
    margin-top: -7px;
    border-radius: 50%;
    transition: left .3s cubic-bezier(.34, 1.4, .5, 1);
  }
  .serve.court-right .ball { left: calc(100% - 14px); }
  .serve-a .ball { background: var(--ball); }
  .serve-b .ball { background: var(--glass); }

  .point {
    font-size: 96px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: -.035em;
    font-variant-numeric: tabular-nums;
  }
  .pt-a { color: var(--ball); }
  .pt-b { color: var(--glass); }
  .pt-dim { color: #2c3948; }

  .games { display: flex; align-items: baseline; gap: 5px; }
  .games-n {
    font-size: 26px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--chalk);
  }
  .games-l {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: .16em;
    color: var(--shade);
  }
  .gm-dim .games-n, .gm-dim .games-l { color: #3a4756; }

  /* --- l'état de la balle : la seule ligne qui crée de la tension --- */
  .ballstate { height: 34px; display: flex; align-items: center; justify-content: center; }
  .status-text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .17em;
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .st-none    { color: transparent; border-color: transparent; }
  .st-a       { color: var(--ball);  border-color: rgba(228, 242, 74, .35); background: rgba(228, 242, 74, .07); }
  .st-b       { color: var(--glass); border-color: rgba(87, 176, 255, .35); background: rgba(87, 176, 255, .07); }
  .st-warn    { color: var(--alert); border-color: rgba(255, 179, 64, .4);  background: rgba(255, 179, 64, .08); }
  .st-neutral { color: var(--chalk); border-color: var(--line); }

  /* --- commandes : pondérées par la fréquence d'usage --- */
  .bar {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 7px;
    padding: 0 12px 12px;
  }
  .btn {
    flex: 1;
    height: 44px;
    background: #131c27;
    border: 1px solid var(--line);
    border-radius: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    color: inherit;
    font-family: inherit;
  }
  .btn-wide { flex: 1.5; }
  .btn:active { background: #1a2635; }
  .btn:focus-visible { outline: 2px solid var(--glass); outline-offset: 2px; }
  .btn-danger { background: #3a1620; border-color: #6d2233; }
  .btn-text {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .13em;
    color: #a9bccd;
  }
  .btn-text-off { color: #3a4756; }

  /* --- feuille de réglages --- */
  .panel {
    width: 410px;
    max-width: 100%;
    background: #131c27;
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 15px 16px;
    font-size: 13px;
    line-height: 1.65;
  }
  .panel h2 {
    margin: 0 0 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--shade);
  }
  .rules { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .rules button {
    background: #0d141d;
    border: 1px solid var(--line);
    color: #a9bccd;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .rules button[aria-pressed="true"] { border-color: rgba(228, 242, 74, .5); color: var(--ball); }
  .rules button:focus-visible { outline: 2px solid var(--glass); outline-offset: 2px; }
  .hint { color: var(--shade); margin: 0; }
  .diag {
    margin: 12px 0 0;
    padding: 10px 12px;
    background: #0a1018;
    border: 1px solid var(--line);
    border-radius: 10px;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.6;
    color: var(--shade);
    white-space: pre;
    overflow-x: auto;
  }
  .diag b { color: var(--ball); font-weight: 700; }
  .diag i { color: var(--alert); font-style: normal; }
  .sheet-close { display: none; }
  .sheet-update {
    display: block;
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    background: #0d141d;
    border: 1px solid var(--line);
    border-radius: 10px;
    color: var(--shade);
    font-family: inherit;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    cursor: pointer;
  }

  /* --- téléphone : le terrain occupe tout l'écran --- */
  @media (max-width: 559px), (pointer: coarse) and (max-height: 620px), (pointer: coarse) and (max-width: 900px) {
    body { padding: 0; gap: 0; display: block; background: var(--court); }
    .watch {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .matchline { height: 8%; min-height: 44px; padding: 0 5vmin; }
    .phase   { font-size: 2.9vmin; }
    .history { font-size: 3vmin; }
    .team    { font-size: 3.2vmin; }
    .serve   { height: 4.4vmin; width: 15vmin; }
    .serve::before, .serve::after,
    .ball    { width: 3.6vmin; height: 3.6vmin; margin-top: -1.8vmin; }
    .serve.court-right .ball { left: calc(100% - 3.6vmin); }
    .sets    { font-size: 3.2vmin; min-width: 5.4vmin; }
    .point   { font-size: 25vmin; }
    .games-n { font-size: 7vmin; }
    .games-l { font-size: 2.4vmin; }
    .half    { gap: 1.6vmin; }
    .net     { height: 66%; }
    .ballstate { height: 9%; min-height: 34px; }
    .status-text { font-size: 3vmin; }
    .bar { height: 13%; min-height: 58px; padding: 0 3vmin 2vmin; gap: 2vmin; }
    .btn { height: 82%; max-height: 60px; }
    .btn-text { font-size: 2.7vmin; }

    .panel {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      width: 100%;
      border-radius: 18px 18px 0 0;
      border-width: 1px 0 0;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
      transform: translateY(105%);
      transition: transform .22s ease;
      box-shadow: 0 -14px 44px rgba(0, 0, 0, .7);
    }
    body.show-rules .panel { transform: none; }
    .hint { display: none; }
    .sheet-close {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 11px;
      background: #1a2635;
      border: 0;
      border-radius: 10px;
      color: #a9bccd;
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      cursor: pointer;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .half::after, .panel, .ball { transition: none; }
    .half::before, .point.land, .games-n.pop { animation: none; }
  }

  kbd {
    background: #0a1018;
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: var(--mono);
  }
</style>
</head>
<body>

<div class="watch" id="watch">
  <header class="matchline">
    <span class="phase" id="phase">SET 1</span>
    <span class="history" id="summary"></span>
  </header>

  <div class="court">
    <div class="half half-a" id="sideA">
      <div class="plate"><span class="team" id="teamA">NOUS</span><span class="sets" id="setsA">0</span></div>
      <div class="serve serve-a" id="serveA" aria-label="côté de service"><span class="ball"></span></div>
      <div class="point pt-a" id="pointA">0</div>
      <div class="games" id="gameboxA"><span class="games-n" id="gamesA">0</span><span class="games-l">JEUX</span></div>
    </div>

    <div class="net" aria-hidden="true"></div>

    <div class="half half-b" id="sideB">
      <div class="plate"><span class="team" id="teamB">EUX</span><span class="sets" id="setsB">0</span></div>
      <div class="serve serve-b" id="serveB" aria-label="côté de service"><span class="ball"></span></div>
      <div class="point pt-b" id="pointB">0</div>
      <div class="games" id="gameboxB"><span class="games-n" id="gamesB">0</span><span class="games-l">JEUX</span></div>
    </div>
  </div>

  <div class="ballstate"><span class="status-text st-none" id="status">.</span></div>

  <div class="bar">
    <button class="btn btn-wide" id="btnUndo"><span class="btn-text btn-text-off" id="undoText">ANNULER</span></button>
    <button class="btn" id="btnNew"><span class="btn-text" id="newText">NOUVEAU</span></button>
    <button class="btn" id="btnSettings"><span class="btn-text">RÉGLAGES</span></button>
  </div>
</div>

<div class="panel" id="panel">
  <h2>REGLES (relance un match)</h2>
  <div class="rules">
    <button id="ruleGolden" aria-pressed="false">Point en or</button>
    <button id="ruleSuperTb" aria-pressed="false">Super tie-break au 3e set</button>
    <button id="ruleFormat" aria-pressed="true">3 sets</button>
    <button id="ruleAwake" aria-pressed="false" hidden>Écran allumé</button>
    <button id="ruleNotify" aria-pressed="false" hidden>Notifs montre</button>
    <button id="ruleRemote" aria-pressed="false" hidden>Boutons montre (essai)</button>
  </div>
  <p class="hint">
    Touchez une moitie de l'ecran pour marquer.
    Clavier : <kbd>&larr;</kbd> ou <kbd>A</kbd> pour NOUS, <kbd>&rarr;</kbd> ou <kbd>P</kbd> pour EUX,
    <kbd>Z</kbd> annuler, <kbd>N</kbd> nouveau match.
  </p>
  <pre class="diag" id="diag">diagnostic…</pre>
  <button class="sheet-update" id="forceUpdate">FORCER LA MISE À JOUR</button>
  <button class="sheet-close" id="sheetClose">FERMER</button>
</div>

<script src="../src/common/padel-engine.js"></script>
<script>
(function () {
  'use strict';
  var engine = window.PadelEngine;
  var BALL_LABELS = { game: 'BALLE DE JEU', set: 'BALLE DE SET', match: 'BALLE DE MATCH' };
  var ENDS_LABEL = 'CHANGEMENT DE CÔTÉ';
  var BALL_RANK = { game: 1, set: 2, match: 3 };
  var STORAGE_KEY = 'padel.web.v1';
  // Remplacé à la compilation ; reste tel quel quand on sert web/ directement.
  var BUILD = '__BUILD__';

  var rules = { goldenPoint: false, superTieBreak: false, setsToWin: 2 };
  var match = null;
  var confirmTimer = null;

  var $ = function (id) { return document.getElementById(id); };

  function setClass(el, base, extra) { el.className = extra ? base + ' ' + extra : base; }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, engine.serialize(match)); } catch (e) { /* mode prive */ }
  }

  function load() {
    try { return engine.deserialize(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
  }

  function refresh() {
    var m = match;
    var status = engine.pointStatus(m);
    var server = engine.currentServer(m);

    $('teamA').textContent = m.config.teams[0];
    $('teamB').textContent = m.config.teams[1];

    $('phase').textContent = m.finished ? 'MATCH TERMINÉ'
      : m.superTieBreak ? 'SUPER TIE-BREAK'
      : m.tieBreak ? 'JEU DÉCISIF'
      : 'SET ' + engine.currentSetNumber(m);

    // Les sets gagnés appartiennent désormais à chaque camp ; le bandeau ne
    // garde que les sets déjà joués.
    $('summary').textContent = engine.setSummary(m).join(' · ');
    $('setsA').textContent = m.sets[0];
    $('setsB').textContent = m.sets[1];
    setClass($('setsA'), 'sets', m.sets[0] > 0 ? 'won' : '');
    setClass($('setsB'), 'sets', m.sets[1] > 0 ? 'won' : '');

    if (m.finished) {
      // Points et jeux sont remis à zéro : on affiche les sets gagnés.
      $('pointA').textContent = m.sets[0];
      $('pointB').textContent = m.sets[1];
      setClass($('pointA'), 'point', m.winner === 0 ? 'pt-a' : 'pt-dim');
      setClass($('pointB'), 'point', m.winner === 1 ? 'pt-b' : 'pt-dim');
    } else {
      $('pointA').textContent = engine.pointLabel(m, 0);
      $('pointB').textContent = engine.pointLabel(m, 1);
      $('gamesA').textContent = m.games[0];
      $('gamesB').textContent = m.games[1];
      setClass($('pointA'), 'point', 'pt-a');
      setClass($('pointB'), 'point', 'pt-b');
    }
    $('gameboxA').hidden = m.finished;
    $('gameboxB').hidden = m.finished;

    // Le camp au service s'éclaire, et annonce depuis quel côté il engage :
    // on sert à droite en début de jeu, puis on alterne à chaque point.
    var servingA = !m.finished && server === 0;
    var servingB = !m.finished && server === 1;
    $('sideA').classList.toggle('serving', servingA);
    $('sideB').classList.toggle('serving', servingB);
    var aDroite = engine.servingCourt(m) === 'right';
    var piste = aDroite ? ' court-right' : '';
    setClass($('serveA'), 'serve serve-a', (servingA ? 'on' : '') + piste);
    setClass($('serveB'), 'serve serve-b', (servingB ? 'on' : '') + piste);
    var dit = 'service ' + (aDroite ? 'à droite' : 'à gauche');
    $('serveA').setAttribute('aria-label', servingA ? dit : '');
    $('serveB').setAttribute('aria-label', servingB ? dit : '');

    setClass($('undoText'), 'btn-text', engine.canUndo(m) ? '' : 'btn-text-off');
    applyStatus(m, status);
    paintRemoteScore();
  }

  function applyStatus(m, status) {
    var el = $('status');
    var text = '';
    var cls = 'st-none';
    if (m.finished) {
      text = 'VICTOIRE ' + m.config.teams[m.winner];
      cls = m.winner === 0 ? 'st-a' : 'st-b';
    } else if (m.changeEnds) {
      text = ENDS_LABEL;
      cls = 'st-warn';
    } else if (!m.tieBreak && !m.config.goldenPoint &&
               (m.points[0] === 4 || m.points[1] === 4 || (m.points[0] === 3 && m.points[1] === 3))) {
      // Avec les avantages, un point marqué par l'un fait retomber l'autre
      // de AV à 40 : sans libellé, on croit à une inversion des côtés.
      if (m.points[0] === 4) { text = 'AVANTAGE ' + m.config.teams[0]; cls = 'st-a'; }
      else if (m.points[1] === 4) { text = 'AVANTAGE ' + m.config.teams[1]; cls = 'st-b'; }
      else { text = 'ÉGALITÉ'; cls = 'st-neutral'; }
    } else {
      var a = status.teams[0], b = status.teams[1];
      if (a && b) {
        var best = BALL_RANK[a] >= BALL_RANK[b] ? a : b;
        text = best === 'game' && status.golden ? 'POINT EN OR' : BALL_LABELS[best];
        cls = 'st-warn';
      } else if (a || b) {
        text = BALL_LABELS[a || b];
        cls = a ? 'st-a' : 'st-b';
      }
    }
    el.textContent = text || '.';
    setClass(el, 'status-text', cls);
  }

  function buzz(ms) {
    if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) { /* ignore */ } }
  }

  // Trace du dernier point : quelle moitié a reçu le toucher, à quelle
  // abscisse, pour quelle équipe, et le score obtenu. C'est ce qui permet de
  // distinguer un défaut de zone tactile d'un défaut d'affichage.
  var lastAction = null;

  function note(ev, zone, team) {
    lastAction = {
      zone: zone,
      x: ev && typeof ev.clientX === 'number' ? Math.round(ev.clientX) : null,
      largeur: window.innerWidth,
      team: team
    };
  }

  function addPoint(team) {
    if (match.finished) return;
    cancelConfirm();
    var setsBefore = match.setHistory.length;
    var gamesBefore = match.games[team];
    engine.addPoint(match, team);

    // La carte de notification sur la montre a deux lignes : un titre lu en
    // premier, un detail dessous. On les separe au lieu de tout empiler.
    var who = match.config.teams[team];
    var milestone = null;
    if (match.finished) {
      milestone = {
        titre: 'Match ' + who + ' ' + match.sets[0] + '-' + match.sets[1],
        detail: engine.setSummary(match).join(' · ')
      };
    } else if (match.setHistory.length > setsBefore) {
      var played = engine.setSummary(match);
      milestone = {
        titre: 'Set ' + who + ' ' + played[played.length - 1],
        detail: 'Sets ' + match.sets[0] + '-' + match.sets[1]
      };
    } else if (match.games[team] > gamesBefore) {
      milestone = {
        titre: 'Jeu ' + who,
        // Tant qu'aucun set n'est joue, l'annoncer 0-0 n'apprend rien.
        // Au changement de jeu, le service change de camp : c'est le moment
        // ou l'annoncer sert le plus.
        detail: 'Jeux ' + match.games[0] + '-' + match.games[1] +
          ' · Service ' + match.config.teams[engine.currentServer(match)] +
          (match.sets[0] + match.sets[1] > 0
            ? ' · Sets ' + match.sets[0] + '-' + match.sets[1]
            : '')
      };
    }

    if (lastAction && lastAction.team === team) {
      lastAction.equipe = match.config.teams[team];
      lastAction.score = engine.pointLabel(match, 0) + ' | ' + engine.pointLabel(match, 1);
    }

    buzz(milestone ? 120 : 25);
    if (milestone) notify(milestone.titre, milestone.detail);
    save();
    refresh();

    // On anime ce qui a changé : le point qui atterrit, ou le camp qui
    // remporte le jeu. Jamais depuis refresh(), qui sert aussi à annuler
    // un point ou à recharger un match.
    var cote = team === 0 ? 'A' : 'B';
    if (!milestone) {
      replay($('point' + cote), 'land');
    } else {
      var jeuSeul = milestone.titre.indexOf('Jeu ') === 0;
      replay($('side' + cote), jeuSeul ? 'won-game' : 'won-set', ['won-game', 'won-set']);
      if (!match.finished) replay($('games' + cote), 'pop');
    }
  }

  function undo() {
    if (!engine.undo(match)) return;
    cancelConfirm();
    buzz(25);
    save();
    refresh();
  }

  function confirmNeeded() {
    if (match.finished) return false;
    return match.sets[0] + match.sets[1] + match.games[0] + match.games[1] +
      match.points[0] + match.points[1] > 0;
  }

  function cancelConfirm() {
    if (confirmTimer) { clearTimeout(confirmTimer); confirmTimer = null; }
    $('newText').textContent = 'NOUVEAU';
    $('btnNew').classList.remove('btn-danger');
  }

  function newMatch() {
    if (confirmNeeded() && $('newText').textContent !== 'CONFIRMER') {
      $('newText').textContent = 'CONFIRMER';
      $('btnNew').classList.add('btn-danger');
      confirmTimer = setTimeout(cancelConfirm, 4000);
      return;
    }
    start();
  }

  function start() {
    cancelConfirm();
    match = engine.createMatch(rules);
    buzz(120);
    save();
    refresh();
  }

  /* --- ecran maintenu allume : le telephone ne doit pas se verrouiller
         entre deux points. Non garanti : l'API n'existe pas partout et peut
         etre refusee (page embarquee, batterie faible). --- */
  var WAKE_KEY = 'padel.wake.v1';
  var wakeLock = null;
  var wakeWanted = true;

  try {
    var saved = localStorage.getItem(WAKE_KEY);
    if (saved !== null) wakeWanted = saved === '1';
  } catch (e) { /* mode prive */ }

  function wakeSupported() {
    return typeof navigator !== 'undefined' && 'wakeLock' in navigator;
  }

  function paintWakeButton() {
    var el = $('ruleAwake');
    el.hidden = !wakeSupported();
    el.setAttribute('aria-pressed', String(wakeWanted && !!wakeLock));
  }

  function acquireWake() {
    if (!wakeSupported() || !wakeWanted || wakeLock || document.hidden) return;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeLock = lock;
      lock.addEventListener('release', function () { wakeLock = null; paintWakeButton(); });
      paintWakeButton();
  paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();
    }, function () {
      // Refus definitif pour cette page : on cesse de demander.
      wakeWanted = false;
      paintWakeButton();
  paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();
    });
  }

  function releaseWake() {
    if (wakeLock) { wakeLock.release(); wakeLock = null; }
    paintWakeButton();
  paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();
  }

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) return;
    acquireWake();
  });

  $('ruleAwake').addEventListener('click', function () {
    wakeWanted = !wakeWanted;
    try { localStorage.setItem(WAKE_KEY, wakeWanted ? '1' : '0'); } catch (e) { /* mode prive */ }
    if (wakeWanted) acquireWake(); else releaseWake();
  });

  /* --- notifications vers la montre ---------------------------------
     La montre n'a pas besoin de l'application : appairee a l'iPhone, elle
     recoit via ANCS les notifications que le telephone produit. On pousse
     donc le score a chaque jeu, set et match — pas a chaque point, qui
     ferait vibrer le poignet septante fois par match.
     iOS ne l'autorise que depuis une page ajoutee a l'ecran d'accueil et
     servie par son propre domaine ; ailleurs le bouton reste masque. --- */
  var NOTIF_KEY = 'padel.notif.v1';
  var notifWanted = false;
  var swReg = null;

  try {
    notifWanted = localStorage.getItem(NOTIF_KEY) === '1';
  } catch (e) { /* mode prive */ }

  function notifSupported() {
    return 'serviceWorker' in navigator &&
      'Notification' in window &&
      typeof ServiceWorkerRegistration !== 'undefined' &&
      'showNotification' in ServiceWorkerRegistration.prototype;
  }

  function paintNotifButton() {
    var el = $('ruleNotify');
    el.hidden = !notifSupported() || !swReg;
    el.setAttribute('aria-pressed', String(notifWanted && Notification.permission === 'granted'));
  }

  if (notifSupported()) {
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      swReg = reg;
      paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();
    }, function () {
      // file://, page embarquee, pas de HTTPS : on s'en passe silencieusement
      paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();
    });
  }

  function notify(title, body) {
    if (!notifWanted || !swReg || Notification.permission !== 'granted') return;
    try {
      swReg.showNotification(title, {
        body: body,
        tag: 'padel-score',      // une seule notification, remplacee a chaque fois
        renotify: true,          // mais qui redonne l'alerte
        icon: 'icon-192.png',
        badge: 'icon-192.png'
      });
    } catch (e) { /* refus du navigateur */ }
  }

  $('ruleNotify').addEventListener('click', function () {
    if (!swReg) return;
    if (Notification.permission === 'granted') {
      notifWanted = !notifWanted;
      try { localStorage.setItem(NOTIF_KEY, notifWanted ? '1' : '0'); } catch (e) { /* ignore */ }
      paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();
      if (notifWanted) notify('Padel', 'Le score arrivera à chaque jeu.');
      return;
    }
    Notification.requestPermission().then(function (result) {
      notifWanted = result === 'granted';
      try { localStorage.setItem(NOTIF_KEY, notifWanted ? '1' : '0'); } catch (e) { /* ignore */ }
      paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();
      if (notifWanted) notify('Padel', 'Le score arrivera à chaque jeu.');
    });
  });

  /* --- marquer depuis la montre -------------------------------------
     Seul canal montre -> telephone qui ne demande rien d'installe : les
     commandes musique. La montre les envoie a l'iPhone via AMS, iOS les
     route vers l'application qui tient la lecture en cours, et une page web
     les recoit par l'API MediaSession.

       piste precedente (bouton de gauche)  -> point pour NOUS
       piste suivante   (bouton de droite)  -> point pour EUX

     En retour, le titre de la lecture en cours porte le score : l'ecran
     musique de la montre devient un tableau d'affichage.

     Conditions : la page doit tenir la lecture en cours, donc jouer un son.
     Un flux quasi silencieux suffit, mais iOS le coupe si le telephone est
     en mode silencieux ou si l'ecran se verrouille — d'ou le maintien de
     l'ecran allume. C'est experimental, et signale comme tel. --- */
  var REMOTE_KEY = 'padel.remote.v1';
  var remoteWanted = false;
  var silence = null;

  try {
    remoteWanted = localStorage.getItem(REMOTE_KEY) === '1';
  } catch (e) { /* mode prive */ }

  function remoteSupported() {
    return 'mediaSession' in navigator && typeof navigator.mediaSession.setActionHandler === 'function';
  }

  /** Un flux d'une seconde, boucle, a un niveau inaudible mais non nul :
      iOS ignore l'attribut volume, la discretion doit venir des echantillons. */
  function silentLoopUrl() {
    var rate = 8000, samples = rate;
    var buffer = new ArrayBuffer(44 + samples * 2);
    var view = new DataView(buffer);
    var ascii = function (offset, text) {
      for (var i = 0; i < text.length; i++) view.setUint8(offset + i, text.charCodeAt(i));
    };
    ascii(0, 'RIFF');
    view.setUint32(4, 36 + samples * 2, true);
    ascii(8, 'WAVEfmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 1, true);          // PCM
    view.setUint16(22, 1, true);          // mono
    view.setUint32(24, rate, true);
    view.setUint32(28, rate * 2, true);
    view.setUint16(32, 2, true);
    view.setUint16(34, 16, true);
    ascii(36, 'data');
    view.setUint32(40, samples * 2, true);
    for (var i = 0; i < samples; i++) view.setInt16(44 + i * 2, i % 2 ? 1 : -1, true);
    return URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  }

  function paintRemoteButton() {
    var el = $('ruleRemote');
    el.hidden = !remoteSupported();
    el.setAttribute('aria-pressed', String(remoteWanted));
  }

  /** Le titre de la lecture en cours porte le score, relu par la montre. */
  function paintRemoteScore() {
    if (!remoteWanted || !remoteSupported() || !window.MediaMetadata) return;
    var m = match;
    if (!m) return;                    // appelé avant le chargement du match
    var teams = m.config.teams;
    // Au poignet, le score et rien d'autre : la montre affiche le point, les
    // jeux en dessous, et une troisieme ligne seulement quand la phase change
    // la facon de compter. Le service reste sur le telephone, ou le camp au
    // service s'eclaire et ou la place ne manque pas.
    var joue = m.sets[0] + m.sets[1] > 0;
    var phase = m.superTieBreak ? 'Super tie-break'
      : m.tieBreak ? 'Jeu decisif'
      : '';
    try {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: m.finished
          ? 'Victoire ' + teams[m.winner]
          : engine.pointLabel(m, 0) + ' - ' + engine.pointLabel(m, 1),
        artist: m.finished
          ? engine.setSummary(m).join(' · ')
          : 'Jeux ' + m.games[0] + '-' + m.games[1] +
            (joue ? ' · Sets ' + m.sets[0] + '-' + m.sets[1] : ''),
        album: m.finished
          ? ''
          : 'Service ' + teams[engine.currentServer(m)] + ' ' +
            (engine.servingCourt(m) === 'right' ? 'droite' : 'gauche') +
            (phase ? ' · ' + phase : '')
      });
    } catch (e) { /* metadonnees refusees */ }
  }

  function startRemote() {
    if (!remoteSupported()) return;
    if (!silence) {
      silence = new Audio(silentLoopUrl());
      silence.loop = true;
      silence.preload = 'auto';
    }
    var resume = function () { silence.play().catch(function () { /* geste requis */ }); };
    resume();   // échoue tant qu'aucun geste n'a eu lieu ; repris dans flash()
    // Les boutons doivent correspondre aux colonnes du tableau de score :
    // ⏮ est à gauche sur l'écran musique, donc il marque pour l'équipe de
    // gauche ; ⏭ est à droite, il marque pour celle de droite.
    var handlers = {
      previoustrack: function () { note(null, 'MONTRE précédent (gauche)', 0); addPoint(0); },
      nexttrack: function () { note(null, 'MONTRE suivant (droite)', 1); addPoint(1); },
      play: resume,
      pause: resume            // la montre ne doit pas pouvoir couper le canal
    };
    // Ne pas déclarer seekforward/seekbackward : iOS remplace alors les
    // boutons piste suivante/précédente par des sauts de 10 secondes.
    for (var action in handlers) {
      try {
        navigator.mediaSession.setActionHandler(action, handlers[action]);
      } catch (e) { /* action inconnue de ce navigateur */ }
    }
    window.__padelRemote = handlers;   // point d'entrée pour les tests
    paintRemoteScore();
  }

  function stopRemote() {
    if (silence) silence.pause();
    if (!remoteSupported()) return;
    ['nexttrack', 'previoustrack', 'play', 'pause'].forEach(function (action) {
      try { navigator.mediaSession.setActionHandler(action, null); } catch (e) { /* ignore */ }
    });
    window.__padelRemote = null;
  }

  $('ruleRemote').addEventListener('click', function () {
    remoteWanted = !remoteWanted;
    try { localStorage.setItem(REMOTE_KEY, remoteWanted ? '1' : '0'); } catch (e) { /* ignore */ }
    paintRemoteButton();
    if (remoteWanted) startRemote(); else stopRemote();
  });

  /* --- diagnostic : dire lequel des maillons lache, plutot que
         laisser l'utilisateur deviner --- */
  function diagLine(label, ok, text) {
    var tag = ok ? 'b' : 'i';
    return label + ' : <' + tag + '>' + text + '</' + tag + '>';
  }

  function paintDiag() {
    var el = $('diag');
    if (!el) return;
    var rows = [];

    rows.push('version        : ' + (BUILD.indexOf('__') === 0 ? 'source (non compilée)' : BUILD));
    if (lastAction) {
      rows.push('dernier point  : moitié ' + lastAction.zone +
        (lastAction.x !== null ? '  x=' + lastAction.x + '/' + lastAction.largeur : '') +
        '  -> ' + (lastAction.equipe || '?') +
        '  -> ' + (lastAction.score || '?'));
    } else {
      rows.push('dernier point  : aucun depuis le chargement');
    }
    // Géométrie réelle des deux moitiés sur l'appareil : si sideA n'est pas
    // à gauche, l'inversion est une affaire de mise en page, pas de logique.
    var court = getComputedStyle(document.querySelector('.court'));
    var ra = $('sideA').getBoundingClientRect();
    var rb = $('sideB').getBoundingClientRect();
    rows.push('disposition    : ' + court.flexDirection + ' · ' + court.direction +
      ' · A=[' + Math.round(ra.left) + ',' + Math.round(ra.right) + ']' +
      ' B=[' + Math.round(rb.left) + ',' + Math.round(rb.right) + ']');
    rows.push('règles         : ' +
      (rules.goldenPoint ? 'point en or' : 'AVANTAGES') + ' · ' +
      (rules.setsToWin === 2 ? '3 sets' : '1 set') +
      (rules.superTieBreak ? ' · super tie-break' : ''));

    rows.push(diagLine('page installée ',
      window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches,
      window.navigator.standalone === true || matchMedia('(display-mode: standalone)').matches
        ? 'oui' : 'non — ouvrir depuis l’icône'));

    rows.push(diagLine('service worker ', !!swReg, swReg ? 'actif' : 'absent'));

    var perm = ('Notification' in window) ? Notification.permission : 'non géré';
    rows.push(diagLine('notifications  ',
      perm === 'granted' && notifWanted,
      perm === 'granted' ? (notifWanted ? 'actives' : 'accordées, désactivées')
        : perm === 'denied' ? 'refusées' : perm === 'default' ? 'à demander' : perm));

    rows.push(diagLine('écran allumé   ', !!wakeLock,
      wakeLock ? 'tenu' : wakeSupported() ? 'non tenu' : 'non géré'));

    var playing = !!silence && !silence.paused && !silence.ended;
    rows.push(diagLine('audio          ',
      !remoteWanted || playing,
      !remoteWanted ? 'inutile (boutons montre off)'
        : playing ? 'en lecture' : 'arrêté — mode silencieux ?'));

    var meta = remoteSupported() && navigator.mediaSession.metadata;
    rows.push(diagLine('média montre   ',
      !remoteWanted || !!meta,
      !remoteWanted ? 'off' : meta ? 'actif — ' + meta.title : 'inactif'));

    el.innerHTML = rows.join('\n');
  }

  setInterval(function () {
    if (document.body.classList.contains('show-rules')) paintDiag();
  }, 1000);

  /* --- reglages hors montre --- */
  function bindRule(id, read, write) {
    var el = $(id);
    el.setAttribute('aria-pressed', String(read()));
    el.addEventListener('click', function () {
      write();
      el.setAttribute('aria-pressed', String(read()));
      document.body.classList.remove('show-rules');
      start();
    });
  }

  /** Relance une animation. Le recalcul forcé est indispensable : reposer la
      classe dans la même frame ne la redéclenche pas. `autres` liste les
      classes concurrentes à retirer, faute de quoi une animation de set
      resterait accrochée et rejouerait à chaque jeu suivant. */
  function replay(el, cls, autres) {
    el.classList.remove(cls);
    if (autres) autres.forEach(function (c) { el.classList.remove(c); });
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function flash(el) {
    acquireWake();
    // Les navigateurs n'autorisent le son qu'après un geste : c'en est un.
    if (remoteWanted && silence && silence.paused) {
      silence.play().catch(function () { /* refus persistant */ });
    }
    el.classList.add('tapped');
    setTimeout(function () { el.classList.remove('tapped'); }, 130);
  }
  $('sideA').addEventListener('click', function (ev) { note(ev, 'GAUCHE', 0); flash(this); addPoint(0); });
  $('sideB').addEventListener('click', function (ev) { note(ev, 'DROITE', 1); flash(this); addPoint(1); });
  $('btnUndo').addEventListener('click', undo);
  $('btnNew').addEventListener('click', newMatch);
  $('btnSettings').addEventListener('click', function () {
    document.body.classList.toggle('show-rules');
    paintDiag();
    $('panel').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
  $('sheetClose').addEventListener('click', function () {
    document.body.classList.remove('show-rules');
  });

  // Sortie de secours : vide le cache et retire le service worker, puis
  // recharge. Le match en cours est dans localStorage, il survit.
  $('forceUpdate').addEventListener('click', function () {
    var el = $('forceUpdate');
    el.textContent = 'MISE À JOUR…';
    var reload = function () { location.reload(); };
    var jobs = [];
    if ('caches' in window) {
      jobs.push(caches.keys().then(function (keys) {
        return Promise.all(keys.map(function (k) { return caches.delete(k); }));
      }));
    }
    if ('serviceWorker' in navigator) {
      jobs.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
        return Promise.all(regs.map(function (r) { return r.unregister(); }));
      }));
    }
    Promise.all(jobs).then(reload, reload);
  });

  bindRule('ruleGolden', function () { return rules.goldenPoint; },
    function () { rules.goldenPoint = !rules.goldenPoint; });
  bindRule('ruleSuperTb', function () { return rules.superTieBreak; },
    function () { rules.superTieBreak = !rules.superTieBreak; });
  bindRule('ruleFormat', function () { return rules.setsToWin === 2; },
    function () { rules.setsToWin = rules.setsToWin === 2 ? 1 : 2; });

  document.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'arrowleft' || k === 'a') { addPoint(0); e.preventDefault(); }
    else if (k === 'arrowright' || k === 'p') { addPoint(1); e.preventDefault(); }
    else if (k === 'z') { undo(); e.preventDefault(); }
    else if (k === 'n') { newMatch(); e.preventDefault(); }
  });

  paintWakeButton();
  paintNotifButton();
  paintRemoteButton();
  if (remoteWanted) startRemote();
  paintDiag();

  match = load();
  if (match) {
    rules.goldenPoint = match.config.goldenPoint;
    rules.superTieBreak = match.config.superTieBreak;
    rules.setsToWin = match.config.setsToWin;
    $('ruleGolden').setAttribute('aria-pressed', String(rules.goldenPoint));
    $('ruleSuperTb').setAttribute('aria-pressed', String(rules.superTieBreak));
    $('ruleFormat').setAttribute('aria-pressed', String(rules.setsToWin === 2));
    refresh();
  } else {
    start();
  }
})();
</script>
</body>
</html>
